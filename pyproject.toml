[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-led-sync"
dynamic = ["version"]
description = "Drive a Bluetooth LE LED strip from your PC: audio-reactive, screen-reactive, or hybrid."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emre Coşkun" }]
keywords = ["ble", "bluetooth", "led", "led-strip", "audio-reactive", "screen-sync", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]
dependencies = [
    "bleak==0.22.3",
    "mss==10.0.0",
    "numpy==2.2.6",
    "desktop-lifecycle>=0.1.3,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ble-led-sync = "led_sync.app:main"

[project.urls]
Homepage = "https://github.com/1emrecoskun/ble-led-sync"
Issues = "https://github.com/1emrecoskun/ble-led-sync/issues"

[tool.setuptools]
packages = ["led_sync"]

[tool.setuptools.dynamic]
version = { attr = "led_sync.__version__" }
